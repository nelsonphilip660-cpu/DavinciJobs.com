<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DavinciJobs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: 85vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: #121629;
            border: 1px solid rgba(255, 255, 255, .1);
            padding: 35px;
            border-radius: 18px;
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-card>p {
            text-align: center;
            color: #a6abc0;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .auth-card label {
            display: block;
            margin: 16px 0 7px;
            font-size: 13px;
        }

        .auth-card input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: #090b16;
            color: white;
            outline: none;
        }

        .auth-card input:focus {
            border-color: #7545e8;
        }

        .auth-card button {
            width: 100%;
            margin-top: 25px;
        }

        .auth-bottom {
            margin-top: 20px;
            text-align: center;
            color: #a6abc0;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #f5c451;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                DAVINCI<span>JOBS</span>
            </a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="auth-container">

        <form class="auth-card" id="registerForm">

            <h1>Create Account</h1>

            <p>Join DavinciJobs and discover new opportunities.</p>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit" class="btn primary-btn">
                Create My Account
            </button>

            <div class="auth-bottom">
                Already registered?
                <a href="login.html">Login here</a>
            </div>

        </form>

    </main>

    <footer>
        <p class="copyright">
            © 2026 DavinciJobs. All rights reserved.
        </p>
    </footer>

    <script type="module" src="js/auth.js"></script>

</body>

</html>

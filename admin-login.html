<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | DavinciJobs</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background: #121629;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #292e48;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .admin-login-card h1 {
            color: #f5c451;
            text-align: center;
            margin-bottom: 10px;
        }

        .admin-login-card p {
            color: #a6abc0;
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #292e48;
            background: #090b16;
            color: white;
            outline: none;
        }

        .admin-login-card button {
            width: 100%;
            padding: 14px;
            background: #7545e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #adminLoginMessage {
            margin-top: 18px;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #f5c451;
        }
    </style>
</head>

<body>

    <div class="admin-login-container">

        <div class="admin-login-card">

            <h1>DAVINCIJOBS</h1>

            <p>Administrator Portal</p>

            <form id="adminLoginForm">

                <input type="email" id="adminEmail" placeholder="Administrator email" required>

                <input type="password" id="adminPassword" placeholder="Password" required>

                <button type="submit" id="adminLoginButton">
                    Login as Administrator
                </button>

            </form>

            <p id="adminLoginMessage"></p>

            <a href="index.html" class="back-home">
                Back to Homepage
            </a>

        </div>

    </div>

    <script type="module">

        import { auth, db } from "./js/firebase.js";

        import {
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


        const form = document.getElementById("adminLoginForm");

        const message = document.getElementById("adminLoginMessage");

        const button = document.getElementById("adminLoginButton");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.getElementById("adminEmail").value.trim();

            const password = document.getElementById("adminPassword").value;

            button.disabled = true;

            button.textContent = "Verifying...";

            message.textContent = "Checking administrator account...";

            try {

                const result = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = result.user;

                const userDocument = await getDoc(
                    doc(db, "users", user.uid)
                );

                if (
                    !userDocument.exists() ||
                    userDocument.data().role !== "admin"
                ) {

                    await signOut(auth);

                    throw new Error(
                        "Access denied. This account is not an administrator."
                    );

                }

                message.textContent = "Login successful!";

                window.location.replace("admin.html");

            } catch (error) {

                console.error("Admin login error:", error);

                message.textContent =
                    error.message || "Login failed. Please try again.";

                button.disabled = false;

                button.textContent = "Login as Administrator";

            }

        });

    </script>

</body>

</html>
